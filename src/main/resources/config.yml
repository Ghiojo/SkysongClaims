# SkysongClaims settings. Run /sclaims reload after editing (database changes need a restart).

# The MySQL database Claims are saved in. It can be the same database as other Skysong plugins.
database:
  host: localhost
  port: 3306
  user: root
  password: ""
  database_name: skysong

# Whether a type's limit counts per character (each SkysongStats profile has its own count)
# or per account (all of a player's characters share one count). A type in types.yml can
# override it with its own limit-per.
limit-per: character

# How long a co-owner invite waits for /sclaim accept, e.g. 30s, 5m or 1h.
invite-expiry: 5m

# How many build groups the owners of one Claim may make, and how many characters one group
# may hold. 0 means no limit.
max-groups-per-claim: 5
max-members-per-group: 0

# The WorldGuard flags owners may set on their whole Claim with /sclaim flag. build and the
# type's open-use flags are always refused, even if listed here.
owner-flags: [greeting, farewell]
