name: SkysongClaims
version: '${version}'
main: org.skysongdev.skysongClaims.SkysongClaims
api-version: '1.21.11'
description: Claims made of WorldGuard regions, owned by SkysongStats characters.

# WorldGuard enforces who may build in a Claim's regions, and every owner is a SkysongStats
# character, so the plugin can't run without either.
depend: [WorldGuard, SkysongStats]

# Downloaded by Paper at start-up: the MySQL connection pool.
libraries:
  - com.zaxxer:HikariCP:6.2.1

commands:
  sclaim:
    description: "Your Claims: take a Free Claim, invite co-owners, leave"
    usage: "/sclaim <take|invite|accept|deny|leave|group|flag|info|list>"
    permission: skysongclaims.use
    # Bukkit doesn't give an alias that another plugin's command uses, so /sc only works when it's free.
    aliases: [sc]
  sclaims:
    description: "Staff commands for Claims"
    usage: "/sclaims <create|delete|addregion|removeregion|settype|free|maxowners|rename|addowner|removeowner|info|list|check|reload>"
    permission: skysongclaims.admin

permissions:
  skysongclaims.use:
    description: "Use /sclaim."
    default: true
  skysongclaims.admin:
    description: "Use /sclaims and do everything in any Claim, including removing owners."
    default: op
