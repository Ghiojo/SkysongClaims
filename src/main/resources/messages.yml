# Every text SkysongClaims shows, in MiniMessage (https://docs.advntr.dev/minimessage/format.html).
# Words in <angle_brackets> that aren't colours are filled in by the plugin. Missing keys use
# the plugin's defaults, so this file can hold only the texts you changed.
prefix: "<dark_gray>[<gold>Claims<dark_gray>] <reset>"

command:
  usage: "<red>Usage: /<usage>"
  unknown-subcommand: "<red>Unknown command <yellow><input></yellow>. Usage: /<usage>"
  no-permission: "<red>You don't have permission to do that."
  not-a-number: "<red><yellow><input></yellow> is not a whole number."
  not-true-or-false: "<red><yellow><input></yellow> must be true or false."
  players-only: "<red>Only players can do that."
  you-have-no-character: "<red>You need to be playing a character first."
  unknown-player: "<red>There is no player called <yellow><player></yellow>."
  no-active-character: "<red><yellow><player></yellow> isn't playing a character. Name the profile too."
  unknown-character: "<red><yellow><player></yellow> has no character called <yellow><profile></yellow>."
  region-needs-world: "<red>From the console, write the world too: <yellow>world:<region></yellow>."

claim:
  unknown: "<red>There is no Claim called <yellow><claim></yellow>."
  invalid-id: "<red><yellow><claim></yellow> can't name a Claim: use up to 32 lower case letters, digits, _ and -."
  id-taken: "<red>There is already a Claim called <yellow><claim></yellow>."
  unknown-type: "<red>There is no Claim type called <yellow><type></yellow> in types.yml."
  no-regions: "<red>A Claim needs at least one region."
  region-missing: "<red>WorldGuard has no region <yellow><region></yellow>."
  region-taken: "<red>The region <yellow><region></yellow> already belongs to the Claim <yellow><claim></yellow>."
  region-not-in-claim: "<red>The region <yellow><region></yellow> is not part of <yellow><claim></yellow>."
  last-region: "<red>That is the last region of <yellow><claim></yellow>. Delete the Claim instead."
  slots-too-low: "<red>A Free Claim needs at least one slot."
  slots-below-owners: "<red><yellow><claim></yellow> already has <owners> owners, so it needs at least that many slots."
  slots-needed: "<red>Say how many slots <yellow><claim></yellow> gets: its type isn't a Free Claim type."
  blank-name: "<red>The name can't be empty."

ownership:
  ok: "<green><character> can own <claim>."
  type-limit: "<red><character> already owns as many <type> Claims as allowed."
  full: "<red><claim> has no free owner slot."
  already-owner: "<red><character> already owns <claim>."
  unknown-character: "<red>SkysongStats has no character called <character>."
  not-free: "<red><claim> is not a Free Claim, so it can't be taken."
  not-owner: "<red>You don't own <claim>."
  no-invite: "<red>You have no Claim invite waiting."
  which-invite: "<red>You have several invites: <claims>. Name the one you mean."

group:
  invalid-name: "<red><yellow><group></yellow> can't name a group: use up to 32 letters, digits, _ and -."
  taken: "<red>There is already a group called <yellow><group></yellow>."
  too-many: "<red>A Claim can have at most <max> groups."
  unknown: "<red><yellow><claim></yellow> has no group called <yellow><group></yellow>."
  owner-member: "<red><character> owns this Claim, so they can already build."
  already-member: "<red><character> is already in <group>."
  not-member: "<red><character> is not in <group>."
  player-not-member: "<red>No character of <player> is in <group>."
  full: "<red>The group <group> already has <max> members."
  created: "<green>Made the group <yellow><group></yellow> in <claim>. Its members can build there."
  deleted: "<green>Deleted the group <yellow><group></yellow> of <claim>."
  renamed: "<green>The group <yellow><group></yellow> is now called <name>."
  member-added: "<green><character> can now build, as a member of <group>."
  member-removed: "<green><character> is no longer in <group>."
  none: "<gray><claim> has no groups. Make one with /sclaim group <claim> create <name>."
  line: "<gray>- <yellow><name></yellow> (<group>): <white><members>"

flag:
  not-editable: "<red>Owners can't set <yellow><flag></yellow>. They can set: <white><flags>"
  bad-value: "<red>WorldGuard won't take that for <flag>: <white><problem>"
  set: "<green>Set <yellow><flag></yellow> on <claim> to <white><value>"
  cleared: "<green>Cleared <yellow><flag></yellow> on <claim>."

signs:
  # The four lines of a Claim sign. The fourth is the price another plugin sets.
  line-name: "<name>"
  line-type: "<type_name>"
  free-open: "<green><open> of <slots> open"
  free-full: "<red>Full"
  for-sale: "<green>For sale"
  owned: "<gray>Owned"
  unowned: ""
  look-at-sign: "<red>Look at a sign first."
  not-a-sign: "<red>That block is not a sign."
  not-linked: "<red>That sign doesn't show a Claim."
  linked: "<green>This sign now shows the Claim <yellow><claim></yellow>."
  unlinked-from: "<green>This sign no longer shows <yellow><claim></yellow>."
  unlinked: "<green>Unlinked and broke the Claim sign."
  protected: "<red>Claim signs can only be removed by staff."
  menu:
    title: "<name>"
    info-name: "<name>"
    info-type: "<gray>Type: <white><type_name>"
    info-owners: "<gray>Owned by: <white><owners>"
    info-no-owners: "<gray>Owned by: <white>nobody"
    info-slots: "<gray>Slots: <white><open> of <slots> open"
    take: "<green>Take a slot"
    leave: "<red>Leave this Claim"
    leave-confirm: "<dark_red>Click again to leave"

player:
  not-in-claim: "<red>You aren't standing in a Claim."
  taken: "<green>You now live in <reset><name></reset><green>. <open> slot(s) left."
  invited: "<green>Invited <character> to co-own <claim>."
  invite-received: "<gold><inviter></gold> <yellow>invited your character <profile> to co-own <reset><name></reset><yellow>. Type <white>/sclaim accept <claim></white> or <white>/sclaim deny <claim></white> within <minutes> minute(s)."
  accepted: "<green>You now co-own <reset><name></reset><green>."
  denied: "<gray>You turned down the invite to <claim>."
  leave-confirm: "<yellow>Leave <reset><name></reset><yellow>? The other owners keep it. Type <white>/sclaim leave <claim> confirm</white>."
  leave-confirm-last: "<yellow>Leave <reset><name></reset><yellow>? You are its last owner, so nobody will own it and its groups are cleared. Type <white>/sclaim leave <claim> confirm</white>."
  left: "<green>You no longer own <reset><name></reset><green>."
  info:
    header: "<gold><name></gold> <gray>(<type_name><gray>)"
    owners: "<gray>Owned by: <white><owners>"
    no-owners: "<gray>Owned by: <white>nobody"
    free-open: "<green>Free Claim: <open> of <slots> slot(s) open. Type /sclaim take to move in."
    free-full: "<gray>Free Claim: all <slots> slot(s) taken."
    for-sale: "<yellow>For sale."
  list:
    header: "<gold>Your character owns <count> Claim(s):"
    none: "<gray>Your character owns no Claims."
    line: "<gray>- <reset><name></reset> <gray>(<claim>)"
    limit: "<gray><type_name><gray>: <white><count> of <limit></white> for this character"
    limit-account: "<gray><type_name><gray>: <white><count> of <limit></white> for all your characters"

claims:
  owner-added: "<green><character> now owns <yellow><claim></yellow>."
  owner-removed: "<green><character> no longer owns <yellow><claim></yellow>."
  player-not-owner: "<red>No character of <player> owns <claim>."
  which-profile: "<red>Several characters of <player> own it. Name the profile too."
  created: "<green>Made the Claim <yellow><claim></yellow> (<type>) from <regions> region(s)."
  created-free: "<green>Made the Free Claim <yellow><claim></yellow> (<type>) from <regions> region(s), with <slots> slot(s)."
  delete-confirm: "<yellow>This deletes <claim>, its <owners> owner(s) and its groups. The WorldGuard regions stay. Type <white>/sclaims delete <claim> confirm</white> to go ahead."
  deleted: "<green>Deleted the Claim <yellow><claim></yellow>."
  region-added: "<green>Added <yellow><region></yellow> to <yellow><claim></yellow>."
  region-removed: "<green>Removed <yellow><region></yellow> from <yellow><claim></yellow>."
  type-set: "<green><yellow><claim></yellow> is now a <yellow><type></yellow>."
  free-on: "<green><yellow><claim></yellow> is now a Free Claim with <slots> slot(s)."
  free-off: "<green><yellow><claim></yellow> is no longer a Free Claim. Its owners may invite as many co-owners as they like."
  renamed: "<green><yellow><claim></yellow> is now called <reset><name></reset>."
  reloaded: "<green>Reloaded SkysongClaims: <types> Claim type(s)."
  reload-failed: "<red>Nothing was reloaded, because a file has a mistake: <white><error>"
  unknown-type-warning: "<yellow>The Claim <claim> has the type <type>, which is no longer in types.yml."
  check:
    missing-region: "<yellow>The Claim <claim> has the region <region>, which WorldGuard no longer has. Fix it with /sclaims removeregion or recreate the region."
    released: "<yellow>Released <character> from <claim>: that character no longer exists."
    done: "<green>Check done: <missing> missing region(s), <released> character(s) released. WorldGuard is up to date."
  info:
    header: "<gold><name></gold> <gray>(<claim>)"
    type: "<gray>Type: <white><type_name></white> (<type>)"
    type-unknown: "<gray>Type: <red><type>, not in types.yml"
    free: "<gray>Free Claim: <white><open> of <slots> slot(s) open"
    bought: "<gray>Bought Claim: <white><owners> owner(s), no cap"
    regions: "<gray>Regions: <white><regions>"
    owners: "<gray>Owned by: <white><owners>"
    no-owners: "<gray>Owned by: <white>nobody"
    groups: "<gray>Groups: <white><groups>"
    flags: "<gray>Owner flags: <white><flags>"
    for-sale: "<gray>For sale, set by <white><plugin>"
  list:
    header: "<gold><count> Claim(s):"
    line: "<gray>- <yellow><claim></yellow> <reset><name></reset> <gray>(<type>, <owners> owner(s))"
    line-free: "<gray>- <yellow><claim></yellow> <reset><name></reset> <gray>(<type>, Free Claim, <owners>/<slots> slots taken)"
    empty: "<gray>No Claims."
