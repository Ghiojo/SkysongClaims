// The public API of SkysongClaims: the only classes other plugins should compile against.
// JitPack publishes this module from a git tag (see jitpack.yml).
plugins {
    id 'java-library'
    id 'maven-publish'
}

// JitPack sets JITPACK and VERSION; local builds keep the org.skysongdev group. Without a
// version JitPack sees the module as "api:unspecified" and publishes nothing.
group = System.getenv('JITPACK') ? 'com.github.Ghiojo' : 'org.skysongdev.skysongClaims'
version = System.getenv('VERSION') ?: '1.0.0'

repositories {
    mavenCentral()
    maven {
        name = 'papermc-repo'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT'
    compileOnly 'org.jetbrains:annotations:26.0.2'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(21)
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    // JitPack builds the javadoc jar, so a missing @param must not fail a release.
    options.addBooleanOption('Xdoclint:none', true)
}

publishing {
    publications {
        maven(MavenPublication) {
            artifactId = 'SkysongClaims'
            from components.java
        }
    }
}
