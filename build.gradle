plugins {
    id 'java'
    id("xyz.jpenilla.run-paper") version "2.3.1"
}

// The api module is configured first so its classes can be added to the plugin jar below.
evaluationDependsOn(':api')

group = 'org.skysongdev'
version = '1.0'

repositories {
    // EngineHub serves WorldGuard and WorldEdit, and nothing else is taken from it.
    maven {
        name = "enginehub"
        url = "https://maven.enginehub.org/repo/"
        content {
            includeGroupByRegex 'com\\.sk89q.*'
        }
    }
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    // Publishes the SkysongStats API module straight from its GitHub repository.
    maven {
        name = "jitpack"
        url = "https://jitpack.io"
    }
}

def paperApi = 'io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT'
// The SkysongStats API at a release tag. JitPack publishes its one module (api) as
// the repository itself, so the coordinate has no ":api".
def skysongStatsApi = 'com.github.Ghiojo:SkysongStats:1.5.0'
// 7.0.17 is the newest WorldGuard built for Java 21 and Paper 1.21.11; 7.0.18 and later
// need Java 25 and Paper 26.
def worldGuard = 'com.sk89q.worldguard:worldguard-bukkit:7.0.17'

dependencies {
    // The public API (api/). Its classes are added to the plugin jar below.
    implementation project(':api')
    compileOnly(paperApi)
    compileOnly 'org.jetbrains:annotations:26.0.2'
    // Hard dependencies (plugin.yml depend:): both ship on the server, so neither is shaded.
    compileOnly(skysongStatsApi)
    // Connection pool for MySQL. Paper downloads it at start-up from plugin.yml's
    // "libraries:" list, so it isn't bundled into the jar.
    compileOnly 'com.zaxxer:HikariCP:6.2.1'
    compileOnly(worldGuard) {
        exclude group: 'org.bukkit'
        exclude group: 'org.spigotmc'
        exclude group: 'io.papermc.paper'
    }

    testImplementation platform('org.junit:junit-bom:6.0.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // MockBukkit 4.116.3 is built against Paper 1.21.11 and doesn't bring the Paper API itself.
    testImplementation 'org.mockbukkit.mockbukkit:mockbukkit-v1.21:4.116.3'
    testImplementation(paperApi)
    testImplementation(skysongStatsApi)
    // The SQL repositories are tested on H2 in MySQL mode: their SQL is plain MySQL.
    testImplementation 'com.h2database:h2:2.3.232'
    testImplementation 'com.zaxxer:HikariCP:6.2.1'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}

tasks {
    runServer {
        // Configure the Minecraft version for our task.
        // This is the only required configuration besides applying the plugin.
        // Your plugin's jar (or shadowJar if present) will be used automatically.
        minecraftVersion("1.21.11")
    }
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

// The api classes ship inside the plugin jar, so the server has exactly one copy of them.
// Plugins that use the API compile against it with compileOnly and never shade it.
tasks.named('jar') {
    from(project(':api').sourceSets.main.output)
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
